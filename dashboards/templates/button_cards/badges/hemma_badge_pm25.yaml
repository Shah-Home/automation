# PM2.5 Badge
# Shows PM2.5 (particulate matter) sensor with color-coded status.
# Thresholds mirror hemma_popup_climate.yaml sensorThresh: good <12, moderate <35.4, high >=55.4 µg/m³.
# Tap: opens hemma_climate_popup (shared climate popup via hemma_popup_base).
#      Falls back to more-info if browser_mod is unavailable.
#
# Variables (passed from hemma_room.yaml):
#   enabled         - show/hide badge (default: true)
#   room_name       - display name shown in popup header
#   entity_quality  - AQ sensor entity_id (used for popup header)
#   entity_temp     - temperature sensor entity_id (popup)
#   entity_humidity - humidity sensor entity_id (popup)
#   sensors         - array of AQ sensor IDs for popup detail rows
# ============================================================================
hemma_badge_pm25:
  template: [hemma_badge_base, hemma_popup_base, hemma_climate_popup]

  variables:
    enabled: true
    room_name: null
    entity_quality: null
    entity_temp: null
    entity_humidity: null
    sensors: null

  icon: mdi:air-filter

  extra_styles: >
    [[[
      const SVG_URL = '/local/hemma/icons/pm25.svg';

      const ev = variables?.enabled;
      const enabled = (ev === undefined || ev === null) ? true :
        (typeof ev === 'boolean') ? ev :
        (typeof ev === 'number') ? ev !== 0 :
        !['false','0','no','off','disabled'].includes(String(ev).trim().toLowerCase());

      const hasEnt  = !!entity?.entity_id;
      const stRaw   = String(entity?.state ?? '').trim();
      const st      = stRaw.toLowerCase();
      const v       = parseFloat(stRaw);
      const hide    = !enabled || !hasEnt || !stRaw || ['unknown','unavailable','none'].includes(st) || Number.isNaN(v);

      return `
        :host{display:${hide ? 'none' : 'inline-block'} !important;}
        #img-cell, .img-cell { position: relative; }
        #img-cell #icon, .img-cell #icon { color: transparent !important; opacity: 0 !important; }
        #img-cell::before, .img-cell::before {
          content: '';
          position: absolute;
          inset: 0;
          background-color: var(--hemma-icon-color, #ffffff);
          -webkit-mask: url('${SVG_URL}') no-repeat center / 85% 85%;
          mask: url('${SVG_URL}') no-repeat center / 85% 85%;
          transform: translateZ(0);
        }
      `;
    ]]]

  styles:
    card:
      - display: >
          [[[
            const ev = variables?.enabled;
            const enabled = (ev === undefined || ev === null) ? true :
              (typeof ev === 'boolean') ? ev :
              (typeof ev === 'number') ? ev !== 0 :
              !['false','0','no','off','disabled'].includes(String(ev).trim().toLowerCase());

            const hasEnt  = !!entity?.entity_id;
            const stRaw   = String(entity?.state ?? '').trim();
            const st      = stRaw.toLowerCase();
            const v       = parseFloat(stRaw);
            const hide    = !enabled || !hasEnt || !stRaw || ['unknown','unavailable','none'].includes(st) || Number.isNaN(v);

            return hide ? 'none' : 'inline-grid';
          ]]]
      - --hemma-icon-color: >
          [[[
            const v = parseFloat(entity?.state);
            if (isNaN(v)) return 'var(--disabled-text-color)';
            if (v < 12)    return 'var(--hemma-badge-air-quality-good-color)';
            if (v < 35.4)  return 'var(--hemma-badge-air-quality-moderate-color)';
            if (v < 55.4)  return 'var(--hemma-badge-air-quality-poor-color)';
            return 'var(--hemma-badge-air-quality-bad-color)';
          ]]]
    icon:
      - color: transparent

  name: >
    [[[
      const v = parseFloat(entity?.state);
      let label = 'Unknown';
      if (!isNaN(v)) {
        if (v < 12)        label = 'Good';
        else if (v < 35.4) label = 'Moderate';
        else if (v < 55.4) label = 'High';
        else               label = 'Very High';
      }

      const esc = (t) => String(t || '').replaceAll('"','"');
      const vStr = !isNaN(v) ? ` · ${Math.round(v * 10) / 10} µg/m³` : '';

      return `
        <div class="badge-wrap">
          <div class="badge-title">PM2.5</div>
          <div class="badge-sub">${esc(label)}${vStr}</div>
        </div>
      `;
    ]]]
