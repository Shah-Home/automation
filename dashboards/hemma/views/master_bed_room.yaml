type: custom:grid-layout
title: master-bed-room
path: master-bed-room
layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
cards:
  # ROOM HERO CARD
  - type: custom:button-card
    template: hemma_room
    name: Master Bedroom
    variables:
      image: bedroom
      image_position: center center

      # Master Bedroom has full environmental monitoring
      show_temp: true
      temp_sensor: sensor.master_bedroom_temperature_sensor

      show_humidity: true
      humidity_sensor: sensor.master_bedroom_humidity_sensor

      show_quality: true
      quality_sensor: sensor.master_bedroom_air_quality_sensor

      show_weather: true
      weather_mode: room
      temp_unit: "F"

      # TODO: {Parth Shah} No motion sensor in master bedroom
      # show_motion: true
      # motion_sensor: binary_sensor.master_bedroom_motion

  # MOBILE NAVBAR
  - !include /config/dashboards/templates/includes/hemma_navbar_mobile.yaml

  # ENTITY CARDS
  - type: custom:layout-card
    class: hemma-entities
    layout_type: custom:grid-layout
    layout: !include /config/dashboards/templates/includes/hemma_entity_layout.yaml
    cards:


      # Master Bedroom Lights (Matter switch)
      - type: custom:button-card
        template: hemma_light
        entity: switch.master_bedroom_lights
        name: Bedroom Lights
        variables:
          icon: light

      # Master Bedroom Speaker (Google Cast)
      - type: custom:button-card
        template: hemma_media
        entity: media_player.master_bedroom_speaker
        name: Bedroom Speaker
        variables:
          icon: speaker

      # VeSync Air Purifier
      - type: custom:button-card
        template: hemma_air_purifier
        entity: fan.air_purifier
        name: Air Purifier
        variables:
          icon: purifier

      # Air Quality Sensors
      - type: custom:button-card
        template: hemma_entity
        entity: sensor.master_bedroom_carbon_dioxide_sensor
        name: CO₂
        state_display: |
          [[[
            const val = Number(entity?.state);
            if (Number.isNaN(val)) return entity?.state || 'Unknown';
            return `${val} ppm`;
          ]]]
        variables:
          icon: co2

      - type: custom:button-card
        template: hemma_entity
        entity: sensor.master_bedroom_pm2_5_sensor
        name: PM2.5
        state_display: |
          [[[
            const val = Number(entity?.state);
            if (Number.isNaN(val)) return entity?.state || 'Unknown';
            return `${val} µg/m³`;
          ]]]
        variables:
          icon: pm25

      - type: custom:button-card
        template: hemma_entity
        entity: sensor.master_bedroom_voc_index_sensor
        name: VOC
        state_display: |
          [[[
            const val = Number(entity?.state);
            if (Number.isNaN(val)) return entity?.state || 'Unknown';
            return `${val} index`;
          ]]]
        variables:
          icon: voc

      # Spotify placeholder — replace entity with media_player.spotify when integration is added
      - type: custom:button-card
        template: hemma_entity
        entity: input_boolean.hemma_mobile_navigation
        name: Spotify
        state_display: "Coming Soon"
        tap_action:
          action: none
        styles:
          card:
            - opacity: 0.5
            - filter: grayscale(1)
            - cursor: default
        variables:
          icon: spotify
