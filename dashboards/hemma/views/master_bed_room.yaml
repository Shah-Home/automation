type: custom:grid-layout
title: master-bed-room
path: master-bed-room
layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
cards:
  # ROOM HERO CARD
  - type: custom:button-card
    template: hemma_room
    name: Master Bedroom
    variables:
      image: bedroom
      image_position: center center

      # Master Bedroom has full environmental monitoring
      show_climate: true
      show_climate_inline: true
      temp_sensor_1: sensor.master_bedroom_temperature_sensor
      temp_unit: "F"

      humidity_sensor: sensor.master_bedroom_humidity_sensor

      quality_sensor: sensor.master_bedroom_air_quality_sensor
      aqi_room_name: Master Bedroom
      aqi_entity_co2: sensor.master_bedroom_carbon_dioxide_sensor
      aqi_entity_pm25: sensor.master_bedroom_pm2_5_sensor
      aqi_entity_voc: sensor.master_bedroom_voc_index_sensor

      # Spotify (shared/common Spotify Connect target) — shown as a media
      # badge in the hero header.
      show_media: true
      show_media_player_1: true
      media_player_1: media_player.common_spotify

      show_weather: true
      weather_mode: room

  # MOBILE NAVBAR
  - !include /config/dashboards/templates/includes/hemma_navbar_mobile.yaml

  # ENTITY CARDS
  - type: custom:layout-card
    class: hemma-entities
    layout_type: custom:grid-layout
    layout: !include /config/dashboards/templates/includes/hemma_entity_layout.yaml
    cards:


      # Master Bedroom Lights (Matter switch)
      - type: custom:button-card
        template: hemma_light
        entity: switch.master_bedroom_lights
        name: Bedroom Lights
        variables:
          icon: light

      # Master Bedroom Speaker (Google Cast)
      - type: custom:button-card
        template: hemma_media
        entity: media_player.master_bedroom_speaker
        name: Bedroom Speaker
        variables:
          icon: speaker

      # VeSync Air Purifier
      - type: custom:button-card
        template: hemma_air_purifier
        entity: fan.air_purifier
        name: Air Purifier
        variables:
          icon: purifier

      # CO2, PM2.5, and VOC are now shown as badges in the hero header
      # (climate row). See the hemma_room variables above.
