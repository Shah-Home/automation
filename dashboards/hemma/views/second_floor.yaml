type: custom:grid-layout
title: second-floor
path: second-floor
layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
cards:
  - type: custom:button-card
    template: hemma_room
    name: Second Floor
    variables:
      image: home
      image_position: center center
      show_weather: true
      weather_mode: room
      temp_unit: "F"

      # Floor-level light badge (Phase 4, §8.2) — aggregates every light
      # switch on this floor into one summary badge (tap to expand into
      # individual controls), instead of a per-room badge. There's only one
      # light per room in this house, so a room-level badge duplicated the
      # room's own entity-grid tile with no added value; floor level is
      # where "see/control everything at a glance" is actually useful.
      show_lights: true
      light_badges:
        - entity: switch.living_room_lights
        - entity: switch.kitchen_island_lights
        - entity: switch.dining_room_lights
        - entity: switch.patio_lights

  - !include /config/dashboards/templates/includes/hemma_navbar_mobile.yaml

  - type: custom:layout-card
    class: hemma-entities
    layout_type: custom:grid-layout
    layout: !include /config/dashboards/templates/includes/hemma_entity_layout.yaml
    cards:
      - type: custom:button-card
        template: hemma_nav_tile
        name: Living Room
        icon: mdi:sofa
        variables:
          path: /dashboard-hemma/living-room
          subtitle: Climate, media, and lights

      - type: custom:button-card
        template: hemma_nav_tile
        name: Kitchen
        icon: mdi:fridge
        variables:
          path: /dashboard-hemma/kitchen
          subtitle: Lights, speakers, and vacuum

      - type: custom:button-card
        template: hemma_nav_tile
        name: Dining Room
        icon: mdi:table-furniture
        variables:
          path: /dashboard-hemma/dining-room
          subtitle: Lights and presence
