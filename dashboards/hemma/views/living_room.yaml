type: custom:grid-layout
title: living-room
path: living-room
layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
cards:
  # ROOM HERO CARD
  - type: custom:button-card
    template: hemma_room
    name: Living Room
    variables:
      image: livingroom
      image_position: center center

      # Room Sensors
      show_climate: true
      show_climate_inline: true
      temp_sensor_1: sensor.living_room_thermostat_temperature
      temp_unit: "F"

      humidity_sensor: sensor.living_room_thermostat_humidity

      # FP2 Presence Zones — shown as badges in the presence row
      occupancy_sensor_1: binary_sensor.powder_room_presence
      occupancy_label_1: Powder Room
      occupancy_sensor_2: binary_sensor.leasure_presence
      occupancy_label_2: Leisure Area
      occupancy_sensor_3: binary_sensor.living_room_presence
      occupancy_label_3: Living Room

      # Weather (room mode shows indoor conditions)
      show_weather: true
      weather_mode: room

      # Motion/Presence (hero motion indicator)
      show_motion: true
      motion_sensor: binary_sensor.living_room_presence

  # MOBILE NAVBAR
  - !include /config/dashboards/templates/includes/hemma_navbar_mobile.yaml

  # ENTITY CARDS
  - type: custom:layout-card
    class: hemma-entities
    layout_type: custom:grid-layout
    layout: !include /config/dashboards/templates/includes/hemma_entity_layout.yaml
    cards:
      # Thermostat
      - type: custom:button-card
        template: hemma_thermostat
        entity: climate.living_room_thermostat
        name: Thermostat
        variables:
          temp_sensor:
            sensor.living_room_thermostat_temperature

            # Living Room TV (Google Cast)
      - type: custom:button-card
        template: hemma_media
        entity: media_player.living_room_tv
        name: Living Room TV
        variables:
          icon: tv

      - type: custom:button-card
        template: hemma_light
        entity: switch.living_room_lights
        name: Lights
        variables:
          icon: light

      # Main Floor Speakers Group
      - type: custom:button-card
        template: hemma_media
        entity: media_player.main_floor_speakers
        name: Main Floor Speakers
        variables:
          icon: speaker

      - type: custom:button-card
        template: hemma_vacuum
        entity: vacuum.cleaning_lady
        name: Clean Living Room
        variables:
          room: living room

      # FP2 Presence Zones are now shown as badges in the hero header
      # (presence row). See the hemma_room variables above.

      # Spotify is wired as a media badge via media_player.spotify when the
      # integration is added (set show_media_player_N + media_player_N on the hero).
