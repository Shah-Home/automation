type: custom:grid-layout
title: living-room
path: living-room
layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
cards:
  # ROOM HERO CARD
  - type: custom:button-card
    template: hemma_room
    name: Living Room
    variables:
      image: livingroom
      image_position: center center

      # Room Sensors
      show_temp: true
      temp_sensor: sensor.living_room_thermostat_temperature

      show_humidity: true
      humidity_sensor: sensor.living_room_thermostat_humidity



      # Weather (room mode shows indoor conditions)
      show_weather: true
      weather_mode: room
      temp_unit: "F"

      # Motion/Presence
      show_motion: true
      motion_sensor: binary_sensor.living_room_presence

  # MOBILE NAVBAR
  - !include /config/dashboards/templates/includes/hemma_navbar_mobile.yaml

  # ENTITY CARDS
  - type: custom:layout-card
    class: hemma-entities
    layout_type: custom:grid-layout
    layout: !include /config/dashboards/templates/includes/hemma_entity_layout.yaml
    cards:
      # Thermostat
      - type: custom:button-card
        template: hemma_thermostat
        entity: climate.living_room_thermostat
        name: Thermostat
        variables:
          temp_sensor:
            sensor.living_room_thermostat_temperature

            # Living Room TV (Google Cast)
      - type: custom:button-card
        template: hemma_media
        entity: media_player.living_room_tv
        name: Living Room TV
        variables:
          icon: tv

      - type: custom:button-card
        template: hemma_light
        entity: switch.living_room_lights
        name: Lights
        variables:
          icon: light

      # Main Floor Speakers Group
      - type: custom:button-card
        template: hemma_media
        entity: media_player.main_floor_speakers
        name: Main Floor Speakers
        variables:
          icon: speaker

      - type: custom:button-card
        template: hemma_vacuum
        entity: vacuum.cleaning_lady
        name: Clean Living Room
        variables:
          room: living room

      # FP2 Presence Zones
      - type: custom:button-card
        template: hemma_motion
        name: Living Room Presence
        variables:
          sensor_1: binary_sensor.powder_room_presence
          label_1: Powder Room
          sensor_2: binary_sensor.leasure_presence
          label_2: Leisure Area
          sensor_3: binary_sensor.living_room_presence
          label_3: Living Room

      # Spotify placeholder — replace entity with media_player.spotify when integration is added
      - type: custom:button-card
        template: hemma_entity
        entity: input_boolean.hemma_mobile_navigation
        name: Spotify
        state_display: "Coming Soon"
        tap_action:
          action: none
        styles:
          card:
            - opacity: 0.5
            - filter: grayscale(1)
            - cursor: default
        variables:
          icon: spotify
