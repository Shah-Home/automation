type: custom:grid-layout
title: patio
path: patio
layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
cards:
  # ROOM HERO CARD
  - type: custom:button-card
    template: hemma_room
    name: Patio
    variables:
      image: patio
      image_position: center center

      # Weather for outdoor area
      show_weather: true
      weather_mode: outdoor
      weather_entity: weather.forecast_home

      temp_unit: "F"

      # Phase 4 pilot (§8.2/§7 4c) — array-based light badge, shown in the
      # hero header alongside the existing entity-grid tile below. Exercises
      # hemma_badge_row + hemma_badge_registry end to end for the first time
      # in a live room. Remove this block (and light_badges/show_lights) to
      # roll back with zero effect on the entity-grid tile.
      show_lights: true
      light_badges:
        - entity: switch.patio_lights

  # MOBILE NAVBAR
  - !include /config/dashboards/templates/includes/hemma_navbar_mobile.yaml

  # ENTITY CARDS
  - type: custom:layout-card
    class: hemma-entities
    layout_type: custom:grid-layout
    layout: !include /config/dashboards/templates/includes/hemma_entity_layout.yaml
    cards:
      # Patio Lights (Matter switch)
      - type: custom:button-card
        template: hemma_light
        entity: switch.patio_lights
        name: Patio Lights
        variables:
          icon: light


