type: custom:grid-layout
title: dining-room
path: dining-room
layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
cards:
  # ROOM HERO CARD
  - type: custom:button-card
    template: hemma_room
    name: Dining Room
    variables:
      image: home
      image_night: diningroom-night
      image_position: center center

      # Luminance (FP2 illuminance) — shown as a badge in the climate row
      show_climate: true
      show_climate_inline: true
      luminance_sensor: sensor.dining_room_light

      # Occupancy (FP2 presence) — shown as a badge in the presence row
      occupancy_sensor_1: binary_sensor.dining_room_presence
      occupancy_label_1: Dining Room

      show_weather: true
      weather_mode: room
      temp_unit: "F"

  # MOBILE NAVBAR
  - !include /config/dashboards/templates/includes/hemma_navbar_mobile.yaml

  # ENTITY CARDS
  - type: custom:layout-card
    class: hemma-entities
    layout_type: custom:grid-layout
    layout: !include /config/dashboards/templates/includes/hemma_entity_layout.yaml
    cards:
      # Dining Room Lights (Matter switch)
      - type: custom:button-card
        template: hemma_light
        entity: switch.dining_room_lights
        name: Dining Lights
        variables:
          icon: light
