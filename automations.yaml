- id: kitchen_lights_dusk_presence_on
  alias: 'Kitchen Lights: On at dusk when occupied'
  description: Turns on the kitchen island lights when the dining room light level
    is 50 lx or lower, the sun is below 10 degrees elevation, and presence is detected
    in the living room, dining room or kitchen. When guest mode is off, both Meetal
    and Parth must be home.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.living_room_presence
    - binary_sensor.dining_room_presence
    to:
    - 'on'
  - trigger: numeric_state
    entity_id: sensor.dining_room_light
    below: input_number.dark_threshold
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: 10
  - trigger: state
    entity_id:
    - person.meetal_mehta
    - person.parth_shah
    to: home
  - trigger: state
    entity_id: input_boolean.guest_mode
    to: 'on'
  conditions:
  - condition: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: 1
  - condition: template
    value_template: "{{ states('sensor.dining_room_light') | float(0) <= states('input_number.dark_threshold') | float(0) }}"
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.living_room_presence
      state: 'on'
    - condition: state
      entity_id: binary_sensor.dining_room_presence
      state: 'on'
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'on'
    - condition: and
      conditions:
      - condition: state
        entity_id: person.meetal_mehta
        state: home
      - condition: state
        entity_id: person.parth_shah
        state: home
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.kitchen_island_lights
  mode: single
- id: kitchen_lights_off_when_empty
  alias: 'Kitchen Lights: Off when empty'
  description: Turns off the kitchen island lights after the living room and dining room
    have both been free of presence for 5 minutes and the lights are on.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.living_room_presence
    - binary_sensor.dining_room_presence
    to: 'off'
    for:
      minutes: 5
  conditions:
  - condition: state
    entity_id: binary_sensor.living_room_presence
    state: 'off'
    for:
      minutes: 5
  - condition: state
    entity_id: binary_sensor.dining_room_presence
    state: 'off'
    for:
      minutes: 5
  - condition: state
    entity_id: switch.kitchen_island_lights
    state: 'on'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.kitchen_island_lights
  mode: single
- id: kitchen_lights_on_when_garage_opens
  alias: "Kitchen Lights: On when the garage opens and it's dark"
  description: Turns on the kitchen island lights when the garage door opens, the
    opening happened within the last 5 minutes, and the dining room light level is
    below the configured dark threshold.
  triggers:
    - trigger: state
      entity_id: binary_sensor.contact_sensor_door_5
      from: "off"
      to: "on"
  conditions:
    - condition: template
      value_template: "{{ (now() - states.binary_sensor.contact_sensor_door_5.last_changed).total_seconds() <= 300 }}"
    - condition: numeric_state
      entity_id: sensor.dining_room_light
      below: input_number.dark_threshold
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.kitchen_island_lights
  mode: single
